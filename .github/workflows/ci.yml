name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        run: mypy app preprocessing

      - name: Pytest
        run: |
          pytest \
            --cov=app \
            --cov=preprocessing \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Bandit
        run: bandit -r app preprocessing evaluation -ll

      - name: Dependency audit
        run: pip-audit

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t license-plate-detector:v3 \
            .

      - name: Start container
        run: |
          docker run -d \
            --name license-plate-v3 \
            -p 8000:8000 \
            license-plate-detector:v3

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "API failed to become healthy."
          docker logs license-plate-v3
          exit 1

      - name: Readiness check
        run: |
          curl --fail --silent http://localhost:8000/ready
          echo

      - name: Verify OpenAPI
        run: |
          curl --fail --silent http://localhost:8000/openapi.json > openapi.json
          python -c "import json; d=json.load(open('openapi.json')); assert '/api/v1/predict' in d['paths']; print('OpenAPI verification passed.')"

      - name: Container logs
        if: always()
        run: docker logs license-plate-v3

      - name: Stop container
        if: always()
        run: docker rm -f license-plate-v3 || true