name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Mypy
        run: mypy app

      - name: Tests
        run: |
          pytest tests/unit \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Frontend utility tests
        run: node --test tests/frontend.test.cjs

      - name: Bandit
        run: bandit -r app preprocessing evaluation -ll

      - name: Dependency security audit
        run: pip-audit

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t license-plate-detector:v3 .

      - name: Start container
        run: |
          docker run -d \
            --name license-plate-v3 \
            -e PORT=8081 \
            -p 8081:8081 \
            license-plate-detector:v3

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8081/health; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "API failed to become healthy."
          docker logs license-plate-v3
          exit 1

      - name: Readiness check
        run: |
          curl --fail --silent http://localhost:8081/ready
          echo

      - name: Verify OpenAPI
        run: |
          curl --fail --silent http://localhost:8081/openapi.json > openapi.json
          python -c "import json; d=json.load(open('openapi.json')); assert '/api/v1/predict' in d['paths'] and '/api/v1/bulk-predict' in d['paths']; print('OpenAPI verification passed.')"

      - name: Install Pillow for smoke tests
        run: python -m pip install Pillow

      - name: Verify single and bulk inference
        shell: bash
        run: |
          python -c "from PIL import Image; Image.new('RGB', (640, 480), color='white').save('smoke.png')"
          python -c "from zipfile import ZipFile; z=ZipFile('smoke.zip', 'w'); z.write('smoke.png'); z.close()"
          curl --fail --silent --show-error -F file=@smoke.png http://localhost:8081/api/v1/predict > single.json
          curl --fail --silent --show-error -F file=@smoke.zip http://localhost:8081/api/v1/bulk-predict > bulk.json
          python -c "import json; one=json.load(open('single.json')); bulk=json.load(open('bulk.json')); assert 'count' in one and 'detections' in one; assert bulk['count']==1 and bulk['results'][0]['filename']=='smoke.png'; print('Single and bulk inference smoke checks passed.')"

      - name: Container logs
        if: always()
        run: docker logs license-plate-v3

      - name: Stop container
        if: always()
        run: docker rm -f license-plate-v3 || true
