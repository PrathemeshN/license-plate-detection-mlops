[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "license-plate-detection-mlops"
version = "0.1.0"
description = "Production-oriented license plate detection and MLOps platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    {name = "License Plate Detection Team"}
]


[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]


[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "S",
]

ignore = [
    "S101",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
]


[tool.black]
line-length = 88
target-version = ["py313"]
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''


[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "tests/",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov=preprocessing",
    "--cov=evaluation",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
]


[tool.coverage.run]
branch = true
source = [
    "app",
    "preprocessing",
    "evaluation",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]


[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
]