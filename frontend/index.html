
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlateVision | License Plate Detection</title>

<style>
:root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-soft: #f1f5f9;
    --surface-hover: #eef3f8;

    --border: #e2e8f0;
    --border-strong: #cbd5e1;

    --text: #1e293b;
    --text-secondary: #475569;
    --muted: #64748b;

    --primary: #315e91;
    --primary-dark: #274b75;
    --primary-soft: #edf3f9;

    --success: #287d58;
    --success-soft: #eef7f2;

    --warning: #a66a19;
    --warning-soft: #fbf5e9;

    --danger: #b54747;
    --danger-soft: #fbefef;

    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 5px 18px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.08);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* =========================
   HEADER
   ========================= */

header {
    position: sticky;
    top: 0;
    z-index: 50;

    height: 64px;
    padding: 0 max(4%, calc((100% - 1280px) / 2));

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: var(--surface);
    border-bottom: 1px solid var(--border);

}

.logo {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text);
}

.logo span {
    color: var(--primary);
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;

    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
}

.dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: var(--success);

    box-shadow: 0 0 0 3px rgba(40, 125, 88, 0.10);
}

/* =========================
   MAIN
   ========================= */

.container {
    width: min(1280px, 92%);
    margin: 0 auto;
    padding: 40px 0 64px;
}

/* =========================
   HERO
   ========================= */

.hero {
    margin-bottom: 26px;
}

.hero h1 {
    margin: 0 0 10px;

    font-size: clamp(28px, 3vw, 36px);
    line-height: 1.2;
    letter-spacing: -0.8px;
    font-weight: 700;

    color: var(--text);
}

.hero p {
    margin: 0;

    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.6;
}

/* =========================
   TABS
   ========================= */

.tabs {
    display: flex;
    align-items: center;
    gap: 4px;

    margin-bottom: 18px;
    padding: 4px;

    width: fit-content;

    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
}

.tab {
    appearance: none;

    border: 1px solid transparent;
    background: transparent;

    color: var(--text-secondary);

    padding: 9px 16px;
    border-radius: 8px;

    cursor: pointer;

    font-size: 13px;
    font-weight: 650;

    transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
}

.tab:hover {
    color: var(--text);
    background: var(--surface);
}

.tab.active {
    color: var(--text);
    background: var(--surface);
    border-color: var(--border);

    box-shadow: var(--shadow-sm);
}

:focus-visible {
    outline: 3px solid rgba(49, 94, 145, 0.42);
    outline-offset: 2px;
}

/* =========================
   PANELS
   ========================= */

.panel {
    display: none;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius-lg);

    padding: 24px;

    box-shadow: var(--shadow-sm);
}

.panel.active {
    display: block;
}

/* =========================
   UPLOAD AREA
   ========================= */

.dropzone {
    display: block;

    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-lg);

    padding: 42px 24px;

    text-align: center;
    cursor: pointer;

    background: var(--surface);

    transition:
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
}

.dropzone:hover {
    border-color: var(--primary);
    background: #fbfdff;
    box-shadow: 0 0 0 3px rgba(49, 94, 145, 0.08);
}

.dropzone:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(49, 94, 145, 0.10);
}

.dropzone h2 {
    margin: 0 0 8px;

    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;

    color: var(--text);
}

.dropzone p {
    margin: 0 0 22px;
}

input[type="file"] {
    display: none;
}

/* =========================
   BUTTONS
   ========================= */

.btn {
    appearance: none;

    border: 1px solid var(--primary);
    border-radius: 9px;

    padding: 11px 17px;

    background: var(--primary);
    color: #ffffff;

    font-size: 13px;
    font-weight: 650;

    cursor: pointer;

    box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.08);

    transition:
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.12s ease;
}

.btn:hover {
    background: var(--primary-dark);
    border-color: var(--primary-dark);

    box-shadow:
        0 4px 12px rgba(37, 99, 235, 0.18);
}

.btn:active {
    transform: translateY(1px);
}

.btn.secondary {
    background: #ffffff;
    color: var(--primary);
    border-color: #c7d5e4;
}

.btn.secondary:hover {
    background: var(--primary-soft);
    border-color: #a9bdd3;
}

.btn.danger {
    background: #ffffff;
    color: var(--danger);
    border-color: #e7c5c5;
}

.btn.danger:hover {
    background: var(--danger-soft);
    border-color: #fca5a5;
}

.actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

/* =========================
   IMAGE PREVIEW
   ========================= */

#previewArea {
    position: relative;
    display: inline-block;

    max-width: 100%;

    margin-top: 25px;

    padding: 0;

    background: transparent;
    border: 0;

    border-radius: var(--radius-lg);
}

#previewArea[hidden] {
    display: none;
}

#preview {
    display: block;

    max-width: 100%;
    max-height: 650px;

    border-radius: 10px;
}

/* =========================
   DETECTION BOX
   ========================= */

.box {
    position: absolute;

    border: 2px solid var(--primary);

    background: rgba(37, 99, 235, 0.07);

    pointer-events: none;

    border-radius: 3px;
}

.box.low {
    border-color: var(--warning);
    background: rgba(217, 119, 6, 0.07);
}

.badge {
    position: absolute;

    top: -27px;
    left: -2px;

    padding: 5px 8px;

    border-radius: 6px 6px 0 0;

    background: var(--primary);
    color: #ffffff;

    font-size: 11px;
    font-weight: 700;

    white-space: nowrap;
}

.low .badge {
    background: var(--warning);
}

/* =========================
   RESULT CARDS
   ========================= */

.results {
    margin-top: 22px;

    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));

    gap: 12px;
}

.card {
    padding: 17px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius-md);

    box-shadow: var(--shadow-sm);
}

.card strong {
    display: block;

    margin: 5px 0;

    font-size: 25px;
    line-height: 1.15;

    color: var(--text);
}

.muted {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.success {
    color: var(--success);
    font-size: 13px;
    font-weight: 650;
}

.warning {
    color: var(--warning);
    font-size: 13px;
    font-weight: 650;
}

.error {
    color: var(--danger);
    font-size: 13px;
    font-weight: 650;
}

/* =========================
   CAMERA
   ========================= */

.camera-wrap {
    position: relative;

    max-width: 1000px;

    margin: auto;

    overflow: hidden;

    background: #e8edf3;

    border-radius: var(--radius-lg);

    border: 1px solid var(--border);

    box-shadow: var(--shadow-md);
}

#video {
    display: block;

    width: 100%;
    height: auto;
    object-fit: contain;
}

.camera-wrap #cameraCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#cameraFrameCanvas {
    display: none;
}

.camera-status {
    max-width: 1000px;

    margin: 12px auto 0;
    padding: 12px 14px;

    color: var(--text-secondary);

    background: var(--surface-soft);

    border: 1px solid var(--border);
    border-radius: 9px;

    font-size: 13px;
}

/* =========================
   TABLE
   ========================= */

table {
    width: 100%;

    margin-top: 22px;

    border-collapse: separate;
    border-spacing: 0;

    overflow: hidden;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    min-width: 700px;
}

th,
td {
    padding: 13px 14px;

    text-align: left;

    border-bottom: 1px solid var(--border);

    font-size: 13px;
}

th {
    background: var(--surface-soft);

    color: var(--text-secondary);

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 0.05em;
}

tbody tr:last-child td {
    border-bottom: 0;
}

tbody tr:hover {
    background: #fafcff;
}

.low-row {
    background: var(--warning-soft);
}

.low-row:hover {
    background: #f8f1e3;
}

.table-scroll {
    width: 100%;
    overflow-x: auto;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}

/* =========================
   RESPONSIVE
   ========================= */

@media (max-width: 800px) {
    header {
        height: 64px;
        padding: 0 4%;
    }

    .container {
        width: 94%;
        padding-top: 36px;
    }

    .tabs {
        width: 100%;
        overflow-x: auto;
    }

    .tab {
        flex: 1;
        white-space: nowrap;
    }

    .panel {
        padding: 17px;
    }

    .dropzone {
        padding: 45px 18px;
    }

    #video {
        min-height: 240px;
    }

    th,
    td {
        padding: 10px;
    }
}

@media (max-width: 520px) {
    .status {
        font-size: 11px;
    }

    .hero p {
        font-size: 14px;
    }

    .dropzone h2 {
        font-size: 18px;
    }

    .results {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Plate<span>Vision</span></div>
    <div class="status">
        Inference workspace
    </div>
</header>

<main class="container">

<section class="hero">
    <h1>License Plate Detection</h1>
    <p>Run license plate detection on an image, an archive, or a live camera feed.</p>
</section>

<nav class="tabs" aria-label="Detection mode">
    <button class="tab active" id="singleTab" type="button" aria-pressed="true" onclick="showTab('single', this)">Single Image</button>
    <button class="tab" id="bulkTab" type="button" aria-pressed="false" onclick="showTab('bulk', this)">Bulk ZIP</button>
    <button class="tab" id="cameraTab" type="button" aria-pressed="false" onclick="showTab('camera', this)">Live Camera</button>
</nav>

<section id="single" class="panel active">

    <label class="dropzone" for="imageInput">
        <h2>Select a vehicle image</h2>
        <p class="muted">PNG, JPG, JPEG or WEBP · Maximum 10 MB</p>
        <button class="btn" type="button"
                onclick="document.getElementById('imageInput').click()">
            Choose Image
        </button>
    </label>

    <input id="imageInput" type="file" accept="image/*">

    <div id="singleStatus" class="muted" style="margin-top:15px" role="status" aria-live="polite"></div>

    <div id="previewArea" hidden>
        <img id="preview" alt="Uploaded vehicle image with detection overlays">
    </div>

    <div id="singleResults" class="results"></div>
</section>

<section id="bulk" class="panel">

    <label class="dropzone" for="zipInput">
        <h2>Upload detection batch</h2>
        <p class="muted">ZIP archive containing vehicle images</p>
        <button class="btn secondary" type="button"
                onclick="document.getElementById('zipInput').click()">
            Choose ZIP
        </button>
    </label>

    <input id="zipInput" type="file" accept=".zip">

    <div id="bulkStatus" class="muted" style="margin-top:15px" role="status" aria-live="polite"></div>

    <div class="actions">
        <button id="exportBtn" class="btn" style="display:none"
                onclick="exportCSV()">Export CSV</button>
    </div>

    <div id="bulkResults"></div>
</section>

<section id="camera" class="panel">

    <div class="camera-wrap">
        <video id="video" autoplay playsinline aria-label="Live camera preview"></video>
        <canvas id="cameraCanvas"></canvas>
    </div>

    <canvas id="cameraFrameCanvas"></canvas>

    <div class="camera-status" id="cameraStatus" role="status" aria-live="polite">
        Camera stopped.
    </div>

    <div class="actions">
        <button class="btn" type="button" onclick="startCamera()">Start Camera</button>
        <button class="btn danger" type="button" onclick="stopCamera()">Stop Camera</button>
    </div>

    <div id="cameraResults" class="results"></div>
</section>

</main>

<script src="/static/bulk-results.js"></script>
<script>
const API = "/api/v1";
let bulkData = [];
let cameraStream = null;
let cameraTimer = null;
let cameraBusy = false;
let cameraStarting = false;
let cameraGeneration = 0;

function showTab(id, button) {
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));

    document.getElementById(id).classList.add("active");
    button.classList.add("active");
    document.querySelectorAll(".tab").forEach(tab =>
        tab.setAttribute("aria-pressed", String(tab === button))
    );

    if (id !== "camera") stopCamera();
}

document.getElementById("imageInput").addEventListener("change", async function() {
    const file = this.files[0];
    if (!file) return;

    const preview = document.getElementById("preview");
    document.getElementById("previewArea").hidden = false;
    preview.src = URL.createObjectURL(file);

    document.getElementById("singleStatus").textContent = "Running YOLO11n V3 inference...";

    const form = new FormData();
    form.append("file", file);

    try {
        const response = await fetch(`${API}/predict`, {
            method: "POST",
            body: form
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || "Inference failed");

        await new Promise(resolve => {
            if (preview.complete) resolve();
            else preview.onload = resolve;
        });

        drawDetections(preview, data.detections);
        renderSingleResults(data);

        document.getElementById("singleStatus").textContent =
            `Detection complete · ${data.count} plate(s) detected`;
    } catch (error) {
        document.getElementById("singleStatus").textContent = error.message;
    }
});

function drawDetections(image, detections) {
    const area = document.getElementById("previewArea");

    area.querySelectorAll(".box").forEach(x => x.remove());

    const naturalWidth = image.naturalWidth;
    const naturalHeight = image.naturalHeight;

    const scaleX = image.clientWidth / naturalWidth;
    const scaleY = image.clientHeight / naturalHeight;

    detections.forEach(d => {
        const box = document.createElement("div");
        box.className = "box" + (d.review_required ? " low" : "");

        box.style.left = `${d.bbox.x1 * scaleX}px`;
        box.style.top = `${d.bbox.y1 * scaleY}px`;
        box.style.width = `${(d.bbox.x2 - d.bbox.x1) * scaleX}px`;
        box.style.height = `${(d.bbox.y2 - d.bbox.y1) * scaleY}px`;

        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent =
            `${(d.confidence * 100).toFixed(1)}%` +
            (d.review_required ? " · REVIEW" : "");

        box.appendChild(badge);
        area.appendChild(box);
    });
}

function renderSingleResults(data) {
    const container = document.getElementById("singleResults");

    if (!data.detections.length) {
        container.innerHTML =
            `<div class="card"><strong>0</strong><br>
             <span class="muted">No license plate detected</span></div>`;
        return;
    }

    container.innerHTML = data.detections.map((d, i) => `
        <div class="card">
            <div class="muted">PLATE ${i + 1}</div>
            <strong>${(d.confidence * 100).toFixed(1)}%</strong>
            <div class="${d.review_required ? "warning" : "success"}">
                ${d.review_required ? "Review Required" : "High Confidence"}
            </div>
        </div>
    `).join("");
}

document.getElementById("zipInput").addEventListener("change", async function() {
    const file = this.files[0];
    if (!file) return;

    document.getElementById("bulkStatus").textContent =
        "Processing ZIP archive...";

    const form = new FormData();
    form.append("file", file);

    try {
        const response = await fetch(`${API}/bulk-predict`, {
            method: "POST",
            body: form
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || "Bulk inference failed");

        bulkData = data.results;
        renderBulkResults(data.results);

        document.getElementById("exportBtn").style.display = "inline-block";
        document.getElementById("bulkStatus").textContent =
            `Processed ${data.count} image(s)`;
    } catch (error) {
        document.getElementById("bulkStatus").textContent = error.message;
    }
});

function renderBulkResults(results) {
    const rows = BulkResults.renderBulkRows(results);

    document.getElementById("bulkResults").innerHTML = `
        <div class="table-scroll"><table>
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Detections</th>
                    <th>Bounding box (x1, y1, x2, y2)</th>
                    <th>Confidence</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table></div>`;
}

function exportCSV() {
    const csv = BulkResults.buildBulkCsv(bulkData);

    const blob = new Blob([csv], {type: "text/csv"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "license_plate_detection_results.csv";
    a.click();

    URL.revokeObjectURL(url);
}

async function startCamera() {
    if (cameraStream || cameraStarting) return;
    const status = document.getElementById("cameraStatus");
    if (!window.isSecureContext) {
        status.textContent = "Camera access requires HTTPS (or localhost).";
        return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent = "This browser does not support camera access.";
        return;
    }

    cameraStarting = true;
    const generation = ++cameraGeneration;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {ideal: "environment"},
                width: {ideal: 1280},
                height: {ideal: 720}
            },
            audio: false
        });
        if (!cameraStarting || generation !== cameraGeneration) {
            stream.getTracks().forEach(track => track.stop());
            return;
        }
        cameraStream = stream;

        document.getElementById("video").srcObject = cameraStream;
        cameraStream.getVideoTracks()[0]?.addEventListener("ended", () => {
            stopCamera();
            status.textContent = "Camera stream ended.";
        }, {once: true});

        status.textContent =
            "Live detection active · analyzing every 1.5 seconds";

        cameraTimer = setInterval(captureCameraFrame, 1500);
    } catch (error) {
        status.textContent = error.name === "NotAllowedError"
            ? "Camera permission was denied. Allow camera access in browser settings."
            : `Camera access failed: ${error.message}`;
    } finally {
        cameraStarting = false;
    }
}

function stopCamera() {
    cameraStarting = false;
    cameraGeneration += 1;
    if (cameraTimer) {
        clearInterval(cameraTimer);
        cameraTimer = null;
    }

    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    const video = document.getElementById("video");
    video.srcObject = null;
    const overlay = document.getElementById("cameraCanvas");
    overlay.getContext("2d").clearRect(0, 0, overlay.width, overlay.height);

    const status = document.getElementById("cameraStatus");

    if (status) status.textContent = "Camera stopped.";
}

async function captureCameraFrame() {
    if (cameraBusy || !cameraStream) return;

    const video = document.getElementById("video");

    if (!video.videoWidth || !video.videoHeight) return;

    cameraBusy = true;
    const generation = cameraGeneration;

    try {
        const canvas = document.getElementById("cameraFrameCanvas");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);

        const blob = await new Promise(resolve =>
            canvas.toBlob(resolve, "image/jpeg", 0.82)
        );
        if (!blob) throw new Error("Could not encode camera frame.");

        const form = new FormData();
        form.append("file", blob, "camera.jpg");

        const response = await fetch(`${API}/predict`, {
            method: "POST",
            body: form
        });

        const data = await response.json();

        if (generation !== cameraGeneration || !cameraStream) return;
        if (!response.ok) throw new Error(data.detail || "Frame inference failed.");

        const detected = data.detections || [];
        const overlay = document.getElementById("cameraCanvas");
        const rect = video.getBoundingClientRect();
        overlay.width = Math.round(rect.width * devicePixelRatio);
        overlay.height = Math.round(rect.height * devicePixelRatio);
        const overlayContext = overlay.getContext("2d");
        overlayContext.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        overlayContext.clearRect(0, 0, rect.width, rect.height);
        const scaleX = rect.width / video.videoWidth;
        const scaleY = rect.height / video.videoHeight;
        detected.forEach(d => {
            const b = d.bbox;
            const color = d.review_required ? "#d97706" : "#2563eb";
            overlayContext.strokeStyle = color;
            overlayContext.lineWidth = 3;
            overlayContext.strokeRect(
                b.x1 * scaleX, b.y1 * scaleY,
                (b.x2 - b.x1) * scaleX, (b.y2 - b.y1) * scaleY
            );
            overlayContext.fillStyle = color;
            overlayContext.font = "bold 14px Segoe UI";
            overlayContext.fillText(
                `${(d.confidence * 100).toFixed(1)}%${d.review_required ? " · REVIEW" : ""}`,
                b.x1 * scaleX,
                Math.max(16, b.y1 * scaleY - 6)
            );
        });

        document.getElementById("cameraResults").innerHTML =
            detected.length
            ? detected.map((d, i) => `
                <div class="card">
                    <div class="muted">LIVE PLATE ${i + 1}</div>
                    <strong>${(d.confidence * 100).toFixed(1)}%</strong>
                    <div class="${d.review_required ? "warning" : "success"}">
                        ${d.review_required ? "Review Required" : "Detected"}
                    </div>
                </div>
              `).join("")
            : `<div class="card">
                 <strong>0</strong><br>
                 <span class="muted">No plate detected in current frame</span>
               </div>`;
    } catch (error) {
        if (generation === cameraGeneration) {
            stopCamera();
            document.getElementById("cameraStatus").textContent =
                `Camera stopped after an error: ${error.message}`;
        }
    } finally {
        cameraBusy = false;
    }
}
</script>

</body>
</html>
